[project]
name = "thai-travel-mcp"
version = "1.0.0"
description = "MCP server for travel planning: weather, accommodation and places worldwide, from free open data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2", # 1.10+ supports structured output; <2 avoids a future breaking release
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 warn about characters that look like Latin letters, which is normal in Thai text
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
