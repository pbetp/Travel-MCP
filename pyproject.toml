[project]
name = "thai-travel-mcp"
version = "1.0.0"
description = "MCP server ข้อมูลท่องเที่ยว: พยากรณ์อากาศ ที่พัก และสถานที่เที่ยว ทั่วโลก จากแหล่งข้อมูลเปิด"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2", # 1.10+ รองรับ structured output; <2 กันการเปลี่ยน API ครั้งใหญ่
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 เตือนตัวอักษรที่หน้าตาคล้ายอักษรละติน ซึ่งเจอเป็นปกติในข้อความภาษาไทย
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: เรียก API จริงผ่านอินเทอร์เน็ต (รันด้วย pytest -m live)"]
